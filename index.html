<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mart - هابي ماركت | توصيل 24 ساعة بأسعار السوق</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        /* Top Bar */
        .top-bar {
            background-color: #e67e22;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Header */
        header {
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 60px;
            width: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #d35400;
        }

        .contact-btn {
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .contact-btn:hover {
            background-color: #1ebc57;
        }

        /* Category Nav */
        .category-nav {
            background: #2c3e50;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .category-nav a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .category-nav a:hover {
            background: #e67e22;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #e67e22;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.95;
        }
