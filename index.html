<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام اليومية</title>
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JS Confetti Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .task-enter {
            animation: slideDown 0.3s ease-out forwards;
        }

        .task-exit {
            animation: fadeOutRight 0.3s ease-in forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-gradient-to-tr from-brand-600 to-indigo-500 rounded-2xl text-white shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">مهامي</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">نظّم يومك بكل سهولة وفاعلية</p>
                </div>
            </div>

            <!-- Theme Toggle & Quick Actions -->
            <div class="flex items-center gap-2">
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all duration-200" title="تبديل المظهر">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-3 gap-3 sm:gap-4 mb-6">
            <div class="bg-white dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col sm:flex-row items-center sm:items-start gap-3 text-center sm:text-right">
                <div class="p-3 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-xl">
                    <i class="fa-solid fa-tasks text-lg"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold block">إجمالي المهام</span>
                    <span id="totalTasksCount" class="text-xl font-bold">0</span>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col sm:flex-row items-center sm:items-start gap-3 text-center sm:text-right">
                <div class="p-3 bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 rounded-xl">
                    <i class="fa-solid fa-spinner text-lg"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold block">قيد الانتظار</span>
                    <span id="pendingTasksCount" class="text-xl font-bold">0</span>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col sm:flex-row items-center sm:items-start gap-3 text-center sm:text-right">
                <div class="p-3 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-xl">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold block">المكتملة</span>
                    <span id="completedTasksCount" class="text-xl font-bold">0</span>
                </div>
            </div>
        </div>

        <!-- Progress Bar Card -->
        <div class="bg-white dark:bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">نسبة الإنجاز</span>
                <span id="progressPercent" class="text-sm font-bold text-brand-600 dark:text-brand-400">0%</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-700/60 rounded-full h-3 overflow-hidden p-0.5">
                <div id="progressBar" class="bg-gradient-to-r from-brand-600 to-indigo-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-xs text-slate-500 dark:text-slate-400 mt-2 text-left">أنجزت 0 من 0 مهام</p>
        </div>

        <!-- Add Task Form -->
        <div class="bg-white dark:bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm mb-6 transition-all">
            <form id="addTaskForm" onsubmit="handleAddTask(event)" class="space-y-4">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="taskTitleInput" placeholder="ما الذي تخطط للقيام به اليوم؟" required
                        class="flex-grow px-4 py-3 bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all placeholder:text-slate-400">
                    
                    <button type="submit" 
                        class="px-6 py-3 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 text-sm whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i>
                        إضافة مهمة
                    </button>
                </div>

                <!-- Priority & Category Pickers -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100 dark:border-slate-700/40 text-xs">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-slate-500 font-medium">الأولوية:</span>
                        <div class="flex gap-1.5">
                            <label class="cursor-pointer">
                                <input type="radio" name="priority" value="low" class="peer hidden">
                                <span class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 peer-checked:bg-emerald-500 peer-checked:text-white transition-all inline-block font-medium">منخفضة</span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="priority" value="medium" checked class="peer hidden">
                                <span class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 peer-checked:bg-amber-500 peer-checked:text-white transition-all inline-block font-medium">متوسطة</span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="priority" value="high" class="peer hidden">
                                <span class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 peer-checked:bg-rose-500 peer-checked:text-white transition-all inline-block font-medium">عالية</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 font-medium">الفئة:</span>
                        <select id="taskCategorySelect" class="bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-200 rounded-lg px-2.5 py-1.5 border-none focus:ring-1 focus:ring-brand-500 font-medium cursor-pointer">
                            <option value="عمل">💼 عمل</option>
                            <option value="شخصي" selected>👤 شخصي</option>
                            <option value="دراسة">📚 دراسة</option>
                            <option value="عام">📌 عام</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Controls & Filters Section -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-5">
            <!-- Filter Tabs -->
            <div class="flex bg-slate-200/60 dark:bg-slate-800/80 p-1 rounded-xl gap-1 text-xs sm:text-sm font-semibold">
                <button onclick="setFilter('all')" id="filter-all" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-lg transition-all bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm">
                    الكل
                </button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    النشطة
                </button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    المكتملة
                </button>
            </div>

            <!-- Search Box & Clear All -->
            <div class="flex gap-2">
                <div class="relative flex-grow sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderTasks()" placeholder="بحث في المهام..." 
                        class="w-full pr-9 pl-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <button onclick="confirmClearCompleted()" title="مسح المهام المكتملة" class="p-2.5 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/40 rounded-xl border border-rose-200 dark:border-rose-800/30 transition-all text-xs flex items-center gap-1 font-semibold whitespace-nowrap">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">مسح المكتمل</span>
                </button>
            </div>
        </div>

        <!-- Task List Container -->
        <div id="taskList" class="space-y-3">
            <!-- Tasks will be injected dynamically here -->
        </div>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden text-center py-12 px-4 bg-white dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
            <div class="w-16 h-16 mx-auto mb-3 text-slate-300 dark:text-slate-600 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800">
                <i class="fa-solid fa-clipboard-check text-3xl"></i>
            </div>
            <h3 class="text-base font-bold text-slate-700 dark:text-slate-300 mb-1">لا يوجد مهام حالياً</h3>
            <p class="text-xs text-slate-400">أضف مهمة جديدة للبدء في تنظيم يومك!</p>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 dark:border-slate-700 text-center space-y-4 transform transition-all scale-95 opacity-0" id="modalBox">
            <div class="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100" id="modalTitle">تأكيد الإجراء</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" id="modalText">هل أنت تأكد من رغبتك في الاستمرار؟</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="modalConfirmBtn" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-all">تأكيد</button>
                <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl text-xs font-bold transition-all">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs font-semibold pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-info text-brand-400 dark:text-brand-600"></i>
        <span id="toastMsg">رسالة التنبيه</span>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200/50 dark:border-slate-800/50 mt-10">
        تطبيق إدارة المهام اليومية &copy; <span id="currentYear"></span>
    </footer>

    <script>
        // Global State
        let tasks = [];
        let currentFilter = 'all';
        let deleteTargetId = null;

        // Priority Mappings
        const priorityConfig = {
            high: { label: 'عالية', bg: 'bg-rose-100 dark:bg-rose-950/40', text: 'text-rose-600 dark:text-rose-400', border: 'border-rose-200 dark:border-rose-800/50' },
            medium: { label: 'متوسطة', bg: 'bg-amber-100 dark:bg-amber-950/40', text: 'text-amber-600 dark:text-amber-400', border: 'border-amber-200 dark:border-amber-800/50' },
            low: { label: 'منخفضة', bg: 'bg-emerald-100 dark:bg-emerald-950/40', text: 'text-emerald-600 dark:text-emerald-400', border: 'border-emerald-200 dark:border-emerald-800/50' }
        };

        // Initialize App
        window.onload = function() {
            document.getElementById('currentYear').innerText = new Date().getFullYear();
            initTheme();
            loadTasks();
            renderTasks();
        };

        // Theme Toggle Logic
        function initTheme() {
            if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.remove('dark');
                updateThemeIcon(false);
            } else {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-lg text-amber-400';
            } else {
                icon.className = 'fa-solid fa-moon text-lg text-slate-600';
            }
        }

        // Storage Functions
        function saveTasks() {
            localStorage.setItem('arabic_todo_tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            const saved = localStorage.getItem('arabic_todo_tasks');
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                } catch(e) {
                    tasks = [];
                }
            } else {
                // Default starter tasks
                tasks = [
                    {
                        id: Date.now() + 1,
                        title: 'أهلاً بك! جرب إضافة مهمة جديدة فوق',
                        completed: false,
                        priority: 'high',
                        category: 'عام',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: Date.now() + 2,
                        title: 'اضغط على الدائرة للتعليم كمنجز',
                        completed: true,
                        priority: 'medium',
                        category: 'شخصي',
                        createdAt: new Date().toISOString(),
                        completedAt: new Date().toISOString()
                    }
                ];
                saveTasks();
            }
        }

        // Add Task
        function handleAddTask(e) {
            e.preventDefault();
            const input = document.getElementById('taskTitleInput');
            const title = input.value.trim();
            if (!title) return;

            const priority = document.querySelector('input[name="priority"]:checked').value;
            const category = document.getElementById('taskCategorySelect').value;

            const newTask = {
                id: Date.now(),
                title: title,
                completed: false,
                priority: priority,
                category: category,
                createdAt: new Date().toISOString(),
                completedAt: null
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            
            input.value = '';
            showToast('تمت إضافة المهمة بنجاح');
        }

        // Toggle Task Completion State
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            task.completed = !task.completed;
            task.completedAt = task.completed ? new Date().toISOString() : null;

            saveTasks();
            renderTasks();

            if (task.completed) {
                triggerConfetti();
                showToast('ممتاز! تم إنجاز المهمة 🎉');
            }
        }

        // Delete Single Task Confirmation
        function confirmDelete(id) {
            deleteTargetId = id;
            showModal(
                'حذف المهمة',
                'هل أنت أصلًا متأكد من حذف هذه المهمة؟ لا يمكن التراجع عن هذا الإجراء.',
                () => {
                    executeDelete(deleteTargetId);
                }
            );
        }

        function executeDelete(id) {
            const taskEl = document.getElementById(`task-${id}`);
            if (taskEl) {
                taskEl.classList.add('task-exit');
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasks();
                    renderTasks();
                    showToast('تم حذف المهمة');
                }, 280);
            } else {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
            closeModal();
        }

        // Clear Completed Tasks
        function confirmClearCompleted() {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('لا يوجد مهام مكتملة لمسحها');
                return;
            }

            showModal(
                'مسح المهام المكتملة',
                `هل أنت متأكد من مسح ${completedCount} مهام مكتملة؟`,
                () => {
                    tasks = tasks.filter(t => !t.completed);
                    saveTasks();
                    renderTasks();
                    closeModal();
                    showToast('تم مسح المهام المكتملة');
                }
            );
        }

        // Filter Handler
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.className = 'filter-tab flex-1 sm:flex-none px-4 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
            });

            const activeTab = document.getElementById(`filter-${filter}`);
            if (activeTab) {
                activeTab.className = 'filter-tab flex-1 sm:flex-none px-4 py-2 rounded-lg transition-all bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm font-bold';
            }

            renderTasks();
        }

        // Render Method
        function renderTasks() {
            const listContainer = document.getElementById('taskList');
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

            // Filter logic
            let filtered = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (searchKeyword) {
                filtered = filtered.filter(task => task.title.toLowerCase().includes(searchKeyword));
            }

            // Update Statistics
            updateStats();

            // Render Empty State
            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }

            // Render Task Cards
            listContainer.innerHTML = filtered.map(task => {
                const prio = priorityConfig[task.priority] || priorityConfig.medium;
                const formattedDate = new Date(task.createdAt).toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div id="task-${task.id}" class="task-enter group bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all flex items-center justify-between gap-3 ${task.completed ? 'opacity-70 bg-slate-50/50 dark:bg-slate-800/40' : ''}">
                        
                        <div class="flex items-center gap-3.5 flex-grow min-w-0">
                            <!-- Custom Checkbox -->
                            <button onclick="toggleTask(${task.id})" class="flex-shrink-0 w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-brand-500'} flex items-center justify-center transition-all">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Task Details -->
                            <div class="flex-grow min-w-0">
                                <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 break-words ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                                    ${escapeHtml(task.title)}
                                </p>

                                <div class="flex flex-wrap items-center gap-2 mt-1.5 text-[11px]">
                                    <!-- Priority Badge -->
                                    <span class="px-2 py-0.5 rounded-md font-medium border ${prio.bg} ${prio.text} ${prio.border}">
                                        ${prio.label}
                                    </span>

                                    <!-- Category Badge -->
                                    <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">
                                        ${escapeHtml(task.category)}
                                    </span>

                                    <!-- Date -->
                                    <span class="text-slate-400 dark:text-slate-500 flex items-center gap-1">
                                        <i class="fa-regular fa-clock text-[10px]"></i>
                                        ${formattedDate}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center gap-1">
                            <button onclick="confirmDelete(${task.id})" class="opacity-80 sm:opacity-0 group-hover:opacity-100 p-2 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all" title="حذف المهمة">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update Dashboard Stats & Progress
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('totalTasksCount').innerText = total;
            document.getElementById('pendingTasksCount').innerText = pending;
            document.getElementById('completedTasksCount').innerText = completed;

            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `أنجزت ${completed} من ${total} مهام`;
        }

        // Celebratory Confetti
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { y: 0.8 }
                });
            }
        }

        // Toast Notification System
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Modal Handlers
        function showModal(title, text, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const modalBox = document.getElementById('modalBox');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;

            const confirmBtn = document.getElementById('modalConfirmBtn');
            confirmBtn.onclick = onConfirm;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-95', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('confirmModal');
            const modalBox = document.getElementById('modalBox');

            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Helper: HTML Escaping to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
